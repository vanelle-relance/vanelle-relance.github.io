<style>
  :root{
    --bg:#F4F8FF;
    --bg-2:#E8F1FF;
    --card:#FFFFFF;
    --ink:#0B1B33;
    --muted:#5A6B85;
    --blue:#1677FF;
    --blue-deep:#0B5CDB;
    --line:rgba(22,119,255,.12);
    --shadow:0 20px 50px rgba(22,119,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    color:var(--ink);
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(22,119,255,.18), transparent 60%),
      linear-gradient(180deg, #F8FBFF 0%, #EEF4FF 45%, #E6F0FF 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px 40px;
  }
  .stage{width:100%;max-width:440px}
  .card{
    background:var(--card);
    border:1px solid rgba(22,119,255,.10);
    border-radius:24px;
    box-shadow:var(--shadow), 0 1px 0 rgba(255,255,255,.8) inset;
    overflow:hidden;
  }
  .header{
    padding:36px 28px 18px;
    text-align:center;
  }
  .mark{
    width:72px;height:72px;
    margin:0 auto 16px;
    border-radius:18px;
    background:#fff;
    border:1px solid rgba(22,119,255,.15);
    box-shadow:0 10px 28px rgba(22,119,255,.18);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .mark img{width:78%;height:78%;object-fit:contain}
  .wordmark{
    font-family:'Outfit',sans-serif;
    font-size:12px;
    letter-spacing:.28em;
    color:var(--muted);
    font-weight:500;
    margin-bottom:10px;
  }
  .hero-title{
    font-family:'Outfit',sans-serif;
    font-size:28px;
    font-weight:700;
    line-height:1.2;
    letter-spacing:-.02em;
    color:var(--ink);
    margin-bottom:8px;
  }
  .hero-title span{color:var(--blue)}
  .hero-sub{
    font-size:14.5px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:4px;
  }
  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:18px 24px 6px;
  }
  .pill{
    font-size:12.5px;
    font-weight:600;
    color:var(--blue-deep);
    background:rgba(22,119,255,.08);
    border:1px solid rgba(22,119,255,.16);
    padding:7px 12px;
    border-radius:999px;
  }
  .body{padding:14px 26px 28px}
  .version-row{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:14px;
  }
  .dot-live{
    width:7px;height:7px;border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 4px rgba(22,119,255,.15);
  }
  .version-text{font-size:13px;color:var(--ink)}
  .version-text b{font-weight:700}
  .meta{
    display:flex;align-items:center;justify-content:center;gap:12px;
    font-size:12.5px;color:var(--muted);margin-bottom:14px;
  }
  .meta .sep{width:1px;height:12px;background:var(--line)}
  .changelog{
    background:#F7FAFF;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    line-height:1.6;
    color:#334155;
    white-space:pre-wrap;
    max-height:140px;
    overflow-y:auto;
    margin-bottom:18px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    padding:16px 18px;
    border:none;border-radius:14px;
    background:linear-gradient(135deg, var(--blue), var(--blue-deep));
    color:#fff;
    font-family:'Outfit',sans-serif;
    font-size:15.5px;font-weight:600;
    text-decoration:none;cursor:pointer;
    box-shadow:0 12px 28px rgba(22,119,255,.28);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(22,119,255,.35)}
  .btn:active{transform:translateY(0)}
  .note{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
    line-height:1.55;
  }
  .status{
    text-align:center;
    padding:28px 0 12px;
    color:var(--muted);
    font-size:13.5px;
  }
  .status.err{color:#B42318}
  .spinner{
    width:26px;height:26px;
    border:2px solid rgba(22,119,255,.2);
    border-top-color:var(--blue);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:18px;
    line-height:1.5;
  }
</style>

<script>
const GITHUB_OWNER = "belingamougoualexis-ctrl";
const GITHUB_REPO = "Vanelle-os-";
const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`;

const statusEl = document.getElementById('status');
const bodyEl = document.getElementById('body-content');

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function safeHttpsUrl(value){
  try{
    const u = new URL(value);
    return u.protocol === 'https:' ? u.href : '';
  }catch(_){ return ''; }
}
function formatSize(bytes){
  const n = Number(bytes);
  if(!Number.isFinite(n) || n <= 0) return '';
  return (n / (1024 * 1024)).toFixed(1).replace('.', ',') + ' Mo';
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}
function setError(message){
  statusEl.classList.add('err');
  statusEl.innerHTML = escapeHtml(message);
  bodyEl.innerHTML = `<button class="btn" type="button" id="retry-btn">Réessayer</button>`;
  document.getElementById('retry-btn').addEventListener('click', chargerDerniereVersion);
}

const iconDownload = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>';

async function chargerDerniereVersion(){
  statusEl.classList.remove('err');
  bodyEl.innerHTML = '';
  statusEl.innerHTML = '<div class="spinner"></div>Recherche de la dernière version…';
  bodyEl.appendChild(statusEl);

  try{
    const res = await fetch(API_URL, {
      method:'GET',
      headers:{'Accept':'application/vnd.github+json'},
      cache:'no-store'
    });
    if(res.status === 404) throw new Error('La dernière Release est introuvable.');
    if(res.status === 403) throw new Error('GitHub limite temporairement les requêtes. Réessaie dans quelques instants.');
    if(!res.ok) throw new Error(`GitHub a répondu avec le code ${res.status}.`);

    const data = await res.json();
    if(data.draft || data.prerelease) throw new Error('La dernière version trouvée n’est pas une Release publique stable.');

    const assets = Array.isArray(data.assets) ? data.assets : [];
    const apkAssets = assets
      .filter(a => typeof a.name === 'string' && a.name.toLowerCase().endsWith('.apk'))
      .map(a => ({...a, url: safeHttpsUrl(a.browser_download_url)}))
      .filter(a => a.url);

    if(!apkAssets.length) throw new Error('Aucun APK disponible dans la dernière Release publiée.');

    const apkAsset = apkAssets.find(a => /vanelle|release|app/i.test(a.name)) || apkAssets[0];
    const version = data.tag_name || data.name || 'Dernière version';
    const dateStr = formatDate(data.published_at || data.created_at);
    const taille = formatSize(apkAsset.size);
    const notes = (data.body && data.body.trim()) || 'Aucune note de version pour cette publication.';

    bodyEl.innerHTML = `
      <div class="version-row">
        <span class="dot-live"></span>
        <span class="version-text">Version <b>${escapeHtml(version)}</b> disponible</span>
      </div>
      <div class="meta">
        ${dateStr ? `<span>${escapeHtml(dateStr)}</span>` : ''}
        ${dateStr && taille ? '<span class="sep"></span>' : ''}
        ${taille ? `<span>${escapeHtml(taille)}</span>` : ''}
      </div>
      <div class="changelog">${escapeHtml(notes)}</div>
      <a class="btn" href="${escapeHtml(apkAsset.url)}" rel="noopener" download>
        ${iconDownload} Télécharger l'APK
      </a>
      <div class="note">
        Ouvre le fichier APK téléchargé pour installer ou mettre à jour Vanelle Relance.
        Si une version précédente est installée, Android peut demander une confirmation.
      </div>
    `;
  }catch(err){
    console.error(err);
    const msg = err instanceof TypeError
      ? 'Connexion impossible. Vérifie Internet puis réessaie.'
      : (err.message || 'Impossible de récupérer la dernière version.');
    setError(msg);
  }
}

chargerDerniereVersion();
</script>
</body>
</html>
